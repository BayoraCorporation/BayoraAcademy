<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago · Bayora Academy</title>
<script src="bayora.js"></script>
<style>
main{max-width:1000px;margin:auto;padding:28px 24px 60px}h1{font-size:1.7rem;animation:up .5s both}.sub{color:var(--soft);margin:4px 0 20px}
.ck{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;animation:up .5s both}.box h2{font-size:1.05rem;margin-bottom:14px}
.yp{display:flex;align-items:center;gap:14px;background:#f3ecf7;border:1px solid #d9c3e4;border-radius:12px;padding:14px 16px;margin-bottom:16px}.lg{width:52px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 .9rem system-ui;flex:none;background:#742284}
.yp div{flex:1;min-width:0}.yp small{display:block;color:#5d4a66;font-size:.76rem}.yp b{font-size:1.15rem;letter-spacing:.04em}.cp{background:#fff;border:1px solid #742284;color:#742284;border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:700;white-space:nowrap}.cp:hover{background:#742284;color:#fff}
.ps{list-style:none;counter-reset:s;margin:0 0 6px}.ps li{counter-increment:s;position:relative;padding:4px 0 10px 34px;font-size:.9rem}.ps li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--deep);color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center}.ps li b{color:var(--ink)}
.rj{background:#fdecea;color:#8f2a1f;border-radius:10px;padding:12px 14px;font-size:.88rem;margin-bottom:16px}.rj b{display:block}
.ck2.w{background:#ffe9a8}.ck2.w svg{stroke:#6b4d00}.pl{display:inline-block;background:#fff4d6;color:#8a6200;font-weight:700;font-size:.78rem;padding:4px 12px;border-radius:999px;margin-top:6px}
.f label{display:block;font-weight:700;font-size:.85rem;margin-top:14px}.f label:first-child{margin-top:0}.f input{width:100%;height:46px;margin-top:6px;padding:0 14px;border:1px solid #8c9da1;border-radius:8px;background:#fff;font-weight:400;font-size:1rem}.f input:focus{outline:2px solid var(--green);border-color:var(--deep)}
.f .h{display:block;color:var(--soft);font-weight:400;font-size:.76rem;margin-top:4px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 label{margin-top:14px}
.er{color:#8f2a1f;min-height:1.3em;margin-top:12px;font-size:.88rem}
.btn{display:block;width:100%;background:var(--green);color:#03231c;font-weight:700;padding:14px;border-radius:999px;margin-top:6px;text-align:center}.btn:disabled{opacity:.6;cursor:wait}.btn.o{background:#fff;border:1px solid var(--deep);color:var(--deep)}
.sm{position:sticky;top:84px}.sm .th{height:90px;border-radius:10px;margin-bottom:12px}.sm h3{font-size:1rem;line-height:1.3}.sm small{color:var(--soft)}
.ln{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}.ln.t{font-size:1.15rem;font-weight:800}.sec{display:flex;gap:8px;align-items:flex-start;color:var(--soft);font-size:.76rem;margin-top:14px}
.ok{text-align:center;padding:36px 24px}.ok .ck2{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 14px;animation:bz-pop .4s both}.ok .ck2 svg{width:32px;height:32px;stroke:#03231c;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rc{text-align:left;max-width:420px;margin:18px auto;font-size:.9rem}.rc div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}.rc span{color:var(--soft)}.rc b{text-align:right;overflow-wrap:anywhere}
.ok .btn{max-width:320px;margin:10px auto 0}[hidden]{display:none!important}
@media(max-width:820px){.ck{grid-template-columns:1fr}.sm{position:static;order:-1}}@media print{.bz-sb,.bz-tb,.btn{display:none!important}}
</style></head><body>
<main id="m"></main>
<script>
const {s}=BY.hdr("c"),G=BY.get,$=x=>document.querySelector(x),M=$("#m"),
id=new URLSearchParams(location.search).get("id"),c=G('courses').find(x=>x.id===id&&x.estado==='publicado');
const SYM={PEN:'S/ ',USD:'US$ ',EUR:'€ '},money=(v,m)=>(SYM[m||'PEN']||(m+' '))+(+v).toFixed(2);
const msg=(h,p)=>M.innerHTML=`<h1>${h}</h1><p class="sub">${p} <a href="catalogo.html" style="color:var(--deep);font-weight:700">Volver al catálogo</a></p>`;
const inscrito=()=>Array.isArray((G('enroll',{})[s.email]||{})[id]);

if(!c)msg("Curso no disponible","Este curso no existe o ya no está publicado.");
else if(!c.precio)location.replace("curso.html?id="+c.id);
else if(inscrito())M.innerHTML=`<h1>Ya tienes este curso</h1><p class="sub">Ya estás inscrito en «${c.titulo}».</p><a class="btn" style="max-width:280px" href="curso.html?id=${c.id}">Ir al curso</a>`;
else if(!BY.ficha(s.email,c.id))location.replace("curso.html?id="+c.id); /* primero se piden nombre y DNI del certificado */
else if(BY.pendiente(s.email,c.id))espera(BY.pendiente(s.email,c.id));
else checkout();

function checkout(){
const total=money(c.precio,c.moneda),Y=BY.YAPE,ult=BY.ultimoPago(s.email,c.id),rj=ult&&ult.estado==='rechazado'?ult:null;let busy=false;
M.innerHTML=`<h1>Finalizar compra</h1><p class="sub">Paga «${c.titulo}» con Yape. Verificamos tu pago manualmente y te damos acceso apenas se confirme.</p>
<div class="ck"><div class="box">${rj?`<div class="rj"><b>Tu pago anterior no pudo verificarse</b>${BY.esc(rj.motivo||'Revisa los datos e inténtalo otra vez.')}</div>`:''}
<h2>Paga con Yape</h2>
<ol class="ps"><li>Abre Yape y yapea <b>${total}</b> a este número:</li></ol>
<div class="yp"><span class="lg">Yape</span><div><small>${BY.esc(Y.titular)}</small><b id="yn">${BY.esc(Y.numero)}</b></div><button type="button" class="cp" id="c1">Copiar número</button></div>
<ol class="ps" style="counter-reset:s 1"><li>Al terminar, Yape te muestra el comprobante. Copia el <b>N.º de operación</b> y pégalo aquí:</li></ol>
<form class="f" id="pf" novalidate>
<label>Nombre con el que aparece tu Yape<input id="tit" autocomplete="name" value="${BY.esc(s.nombre||'')}" placeholder="Ej. Juan Pérez L."><span class="h">Es el nombre que verá el administrador en su Yape. Ayuda a ubicar tu pago más rápido.</span></label>
<label>N.º de operación<input id="op" inputmode="numeric" maxlength="12" placeholder="Ej. 12345678"><span class="h">Aparece en el comprobante de Yape. No necesitas enviar ninguna captura.</span></label>
<p class="er" id="er" role="alert"></p><button class="btn" id="go" type="submit">Ya pagué · enviar para verificación</button></form></div>
<aside class="box sm"><div class="th" data-m="${c.portada||''}" style="background:linear-gradient(135deg,${c.colores[0]},${c.colores[1]})"></div><h3>${c.titulo}</h3><small>Por ${c.instructor}</small>
<div class="ln" style="margin-top:14px"><span>Precio del curso</span><span>${total}</span></div><div class="ln t"><span>Monto a yapear</span><span>${total}</span></div>
<div class="sec"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Yapea el monto exacto. La verificación suele tardar hasta 2 horas; verás aquí mismo cuándo se apruebe.</span></div></aside></div>`;
BY.hydrate(M);
const er=m=>{$("#er").textContent=m||""};
$("#op").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,12);
$("#c1").onclick=async e=>{const b=e.target,n=BY.YAPE.numero.replace(/\s/g,"");try{await navigator.clipboard.writeText(n)}catch{const t=document.createElement("textarea");t.value=n;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}b.textContent="¡Copiado!";setTimeout(()=>b.textContent="Copiar número",1600)};
$("#pf").onsubmit=e=>{e.preventDefault();if(busy)return;er();
 const t=$("#tit").value.trim().replace(/\s+/g," "),op=$("#op").value;
 if(t.length<3||!/^\p{L}[\p{L}' .-]*$/u.test(t))return er("Escribe tu nombre tal como aparece en Yape.");
 if(!/^\d{6,12}$/.test(op))return er("El N.º de operación son solo números (lo ves en el comprobante de Yape).");
 if(BY.opUsada(op))return er("Ese N.º de operación ya fue enviado. Revisa que sea el de tu pago.");
 busy=true;const b=$("#go");b.disabled=true;b.textContent="Enviando…";
 setTimeout(()=>{const r=BY.registrarPago(s,c,{metodo:"Yape",detalle:{titular:t,op}});espera(r)},700)};
}
function espera(r){const E=BY.esc;
M.innerHTML=`<div class="box ok"><div class="ck2 w"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h1 style="animation:none">¡Recibimos tu pago!</h1><span class="pl">Pago en verificación</span><p class="sub" style="margin-top:12px">Estamos confirmando tu Yape. Normalmente tarda hasta <b>2 horas</b>, a veces menos. Apenas se valide tendrás acceso al curso y te avisaremos en tus notificaciones. Puedes cerrar esta página.</p>
<div class="rc"><div><span>Solicitud</span><b>${E(r.id)}</b></div><div><span>Curso</span><b>${c.titulo}</b></div><div><span>Monto</span><b>${money(r.monto,r.moneda)}</b></div><div><span>N.º de operación</span><b>${E(r.detalle.op)}</b></div><div><span>Enviado</span><b>${E(r.fecha)} ${E(r.hora)}</b></div></div>
<a class="btn" href="catalogo.html">Seguir explorando</a><a class="btn o" href="catalogo.html#mi">Ir a Mi aprendizaje</a></div>`;
const t=setInterval(()=>{const x=BY.pagos().find(p=>p.id===r.id);if(!x||x.estado==='verificando')return;clearInterval(t);
 if(x.estado==='pagado')M.innerHTML=`<div class="box ok"><div class="ck2"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1 style="animation:none">¡Pago aprobado!</h1><p class="sub">Ya tienes acceso a «${c.titulo}».</p><a class="btn" href="curso.html?id=${c.id}">Empezar el curso</a></div>`;
 else location.reload()},3000)}
</script></body></html>
