<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promocionar curso · Bayora Academy</title>
<script src="bayora.js"></script>
<style>
main{max-width:1000px;margin:auto;padding:28px 24px 60px}h1{font-size:1.7rem;animation:up .5s both}.sub{color:var(--soft);margin:4px 0 20px}
.ck{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;animation:up .5s both}.box h2{font-size:1.05rem;margin:22px 0 12px}.box h2:first-child,.rj+h2{margin-top:0}
.opts{display:grid;gap:10px}.pn{grid-template-columns:repeat(3,1fr)}
.op{position:relative;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}.op:hover{border-color:#9fb0b4}
.op input{position:absolute;opacity:0;pointer-events:none}.op:has(input:checked){border-color:var(--deep);background:#effaf6}.op:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}
.op .th{width:64px;height:44px;border-radius:8px;flex:none;padding:0}.op b{display:block;font-size:.92rem;line-height:1.3}.op small{color:var(--soft);font-size:.78rem}
.pn .op{flex-direction:column;align-items:flex-start;gap:2px;padding:14px}.pn .op b{font-size:1.05rem}.pn .op .pr{font-size:1.15rem;font-weight:800;color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:700}.chip:hover{border-color:#9fb0b4}.chip.on{border-color:var(--deep);background:#effaf6;color:var(--deep)}.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mo{display:block;font-weight:700;font-size:.85rem;margin-top:14px}.mi{display:flex;align-items:center;margin-top:6px;border:1px solid #8c9da1;border-radius:8px;background:#fff;height:46px;max-width:220px}.mi:focus-within{outline:2px solid var(--green);border-color:var(--deep)}.mi i{font-style:normal;padding:0 10px 0 14px;color:var(--soft);font-weight:700}.mi input{border:0;outline:0;background:none;width:100%;height:100%;padding:0 12px 0 0;font-size:1rem;font-weight:400}
.dy{margin-top:10px;font-size:.9rem;color:var(--deep);font-weight:700;min-height:1.3em}
.yp{display:flex;align-items:center;gap:14px;background:#f3ecf7;border:1px solid #d9c3e4;border-radius:12px;padding:14px 16px;margin:12px 0 16px}.lg{width:52px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 .9rem system-ui;flex:none;background:#742284}
.yp div{flex:1;min-width:0}.yp small{display:block;color:#5d4a66;font-size:.76rem}.yp b{font-size:1.15rem;letter-spacing:.04em}.cp{background:#fff;border:1px solid #742284;color:#742284;border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:700;white-space:nowrap}.cp:hover{background:#742284;color:#fff}
.tx{font-size:.9rem}.tx b{color:var(--ink)}
.rj{background:#fdecea;color:#8f2a1f;border-radius:10px;padding:12px 14px;font-size:.88rem;margin-bottom:16px}.rj b{display:block}.rj.w{background:#fff4d6;color:#8a6200}
.ck2.w{background:#ffe9a8}.ck2.w svg{stroke:#6b4d00}.pl{display:inline-block;background:#fff4d6;color:#8a6200;font-weight:700;font-size:.78rem;padding:4px 12px;border-radius:999px;margin-top:6px}
.f label{display:block;font-weight:700;font-size:.85rem;margin-top:14px}.f input{width:100%;height:46px;margin-top:6px;padding:0 14px;border:1px solid #8c9da1;border-radius:8px;background:#fff;font-weight:400;font-size:1rem}.f input:focus{outline:2px solid var(--green);border-color:var(--deep)}
.f .h{display:block;color:var(--soft);font-weight:400;font-size:.76rem;margin-top:4px}
.er{color:#8f2a1f;min-height:1.3em;margin-top:12px;font-size:.88rem}
.btn{display:block;width:100%;background:var(--green);color:#03231c;font-weight:700;padding:14px;border-radius:999px;margin-top:6px;text-align:center}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.o{background:#fff;border:1px solid var(--deep);color:var(--deep)}
.sm{position:sticky;top:84px}.sm .th{height:90px;border-radius:10px;margin-bottom:12px}.sm h3{font-size:1rem;line-height:1.3}.sm small{color:var(--soft)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}.ln.t{font-size:1.15rem;font-weight:800}.nt{color:var(--soft);font-size:.78rem;margin-top:14px}
.ok{text-align:center;padding:36px 24px}.ok .ck2{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 14px;animation:bz-pop .4s both}.ok .ck2 svg{width:32px;height:32px;stroke:#03231c;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rc{text-align:left;max-width:420px;margin:18px auto;font-size:.9rem}.rc div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}.rc span{color:var(--soft)}.rc b{text-align:right;overflow-wrap:anywhere}
.ok .btn{max-width:320px;margin:10px auto 0}
.hs{margin-top:24px}.hs h2{margin-top:0}.hr{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem}.hr small{display:block;color:var(--soft)}
.bd{padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}.bd.v{background:#fff4d6;color:#8a6200}.bd.a{background:#e1f6ef;color:#0a5c4a}.bd.r{background:#fdecea;color:#8f2a1f}
[hidden]{display:none!important}
@media(max-width:820px){.ck{grid-template-columns:1fr}.sm{position:static;order:-1}.pn{grid-template-columns:1fr}}
</style></head><body>
<main id="m"></main>
<script>
const {s}=BY.hdr("r"),G=BY.get,E=BY.esc,$=x=>document.querySelector(x),M=$("#m"),
me=G('users').find(x=>x.email===s.email)||{},adm=me.rol==='admin',
P=new URLSearchParams(location.search).get("id");
if(!(adm||me.instructor)){location.replace('instructor.html');throw new Error('sin permiso')}
const money=v=>'S/ '+(+v).toFixed(2),fd=f=>new Date(f+'T12:00:00').toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'}),
cursos=G('courses').filter(c=>c.estado==='publicado'&&c.email===s.email),PR=BY.PROMO;
const activa=cid=>G('promos').find(x=>x.cid===cid&&x.fin>=BY.hoy());

if(!cursos.length)M.innerHTML=`<h1>Promocionar un curso</h1><p class="sub">Solo puedes promocionar los cursos que tú subiste, y aún no tienes ninguno publicado. <a href="constructor.html?new=1" style="color:var(--deep);font-weight:700">Crea tu primer curso</a>.</p>`;
else{const pre=P&&cursos.find(c=>c.id===P),pe=pre&&BY.promoPendiente(s.email,pre.id);if(pe)espera(pe,pre);else checkout(pre?pre.id:cursos[0].id)}

function checkout(cid0){
let cid=cid0,mt=10,busy=false;const Y=BY.YAPE,C=()=>cursos.find(c=>c.id===cid),Pl=()=>BY.planPromo(mt),okm=()=>mt>=PR.min&&mt<=PR.max;
M.innerHTML=`<h1>Promocionar un curso</h1><p class="sub">Tu curso aparecerá en el área de Promociones durante el tiempo que elijas. Pagas con Yape y se publica apenas el administrador valide tu pago.</p>
<div class="ck"><div class="box"><div id="rj"></div>
<h2>1. Elige el curso</h2><div class="opts" id="cl">${cursos.map(c=>`<label class="op"><input type="radio" name="c" value="${c.id}" ${c.id===cid?'checked':''}><span class="th" data-m="${c.portada||''}" style="background:linear-gradient(135deg,${c.colores[0]},${c.colores[1]})"></span><span><b>${c.titulo}</b><small>${c.categoria}</small></span></label>`).join('')}</div>
<h2>2. Elige cuánto quieres invertir</h2><div class="chips" id="pn">${PR.rapidos.map(v=>`<button type="button" class="chip" data-v="${v}">${money(v).replace('.00','')}</button>`).join('')}</div>
<label class="mo">Otro monto (mínimo S/ ${PR.min})<span class="mi"><i>S/</i><input id="mo" type="number" inputmode="decimal" min="${PR.min}" max="${PR.max}" step="0.5" value="10"></span></label><p class="dy" id="dy"></p>
<h2>3. Paga con Yape</h2>
<p class="tx">Abre Yape y yapea <b id="tm"></b> a este número:</p>
<div class="yp"><span class="lg">Yape</span><div><small>${E(Y.titular)}</small><b>${E(Y.numero)}</b></div><button type="button" class="cp" id="c1">Copiar número</button></div>
<p class="tx">Al terminar, copia el <b>N.º de operación</b> del comprobante y pégalo aquí:</p>
<form class="f" id="pf" novalidate>
<label>Nombre con el que aparece tu Yape<input id="tit" autocomplete="name" value="${E(s.nombre||'')}" placeholder="Ej. Juan Pérez L."><span class="h">Es el nombre que verá el administrador en su Yape. Ayuda a ubicar tu pago más rápido.</span></label>
<label>N.º de operación<input id="op" inputmode="numeric" maxlength="12" placeholder="Ej. 12345678"><span class="h">Aparece en el comprobante de Yape. No necesitas enviar ninguna captura.</span></label>
<p class="er" id="er" role="alert"></p><button class="btn" id="go" type="submit">Ya pagué · enviar para verificación</button></form></div>
<aside class="box sm"><div class="th" id="sth"></div><h3 id="st"></h3><small id="si"></small>
<div class="ln" style="margin-top:14px"><span>Promoción de <b id="sp"></b></span><span id="sm"></span></div><div class="ln t"><span>Monto a yapear</span><span id="sx"></span></div><p class="nt" id="sn"></p></aside></div>
<div class="box hs" id="hs"></div>`;
BY.hydrate(M);
const er=m=>{$("#er").textContent=m||""};
function upd(){const c=C(),p=Pl(),v=okm(),pe=BY.promoPendiente(s.email,c.id),ul=BY.ultimoPromo(s.email,c.id),a=activa(c.id);
 const t=$("#sth");t.dataset.m=c.portada||'';t.style.cssText=`background:linear-gradient(135deg,${c.colores[0]},${c.colores[1]})`;BY.hydrate($("#sth").parentNode);
 $("#st").innerHTML=c.titulo;$("#si").textContent='Por '+c.instructor;$("#sp").textContent=v?p.nombre:'—';$("#sm").textContent=v?money(p.precio):'—';$("#sx").textContent=v?money(p.precio):'—';$("#tm").textContent=v?money(p.precio):'el monto elegido';
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.v===mt));$("#dy").textContent=v?`${money(p.precio)} = ${p.nombre} de promoción`:`Escribe un monto entre S/ ${PR.min} y S/ ${PR.max}.`;
 $("#sn").textContent=a?`Este curso ya está en promoción hasta el ${fd(a.fin)}. Los ${p.dias} días se suman al final.`:`La promoción empieza cuando el administrador apruebe tu pago y dura ${p.dias} días.`;
 $("#rj").innerHTML=pe?`<div class="rj w"><b>Ya enviaste el pago de este curso</b>Está en verificación (hasta 2 horas). Te avisaremos en tus notificaciones.</div>`:ul&&ul.estado==='rechazado'?`<div class="rj"><b>Tu pago anterior no pudo verificarse</b>${E(ul.motivo||'Revisa los datos e inténtalo otra vez.')}</div>`:'';
 $("#go").disabled=!!pe||!v;er()}
function hist(){const L=BY.pagos().filter(p=>p.tipo==='promo'&&p.email===s.email).reverse();$("#hs").hidden=!L.length;if(!L.length)return;
 $("#hs").innerHTML=`<h2>Tus solicitudes de promoción</h2>`+L.map(p=>`<div class="hr"><div><b>${p.curso}</b><small>${E(p.plan.nombre)} · ${money(p.monto)} · ${E(p.fecha)}${p.estado==='rechazado'&&p.motivo?' · '+E(p.motivo):''}</small></div>${p.estado==='pagado'?`<span class="bd a">Activa hasta ${fd(p.fin||BY.hoy())}</span>`:p.estado==='rechazado'?'<span class="bd r">Rechazado</span>':'<span class="bd v">En verificación</span>'}</div>`).join('')}
$("#cl").onchange=e=>{cid=e.target.value;upd()};$("#pn").onclick=e=>{const b=e.target.closest('.chip');if(!b)return;mt=+b.dataset.v;$("#mo").value=mt;upd()};
$("#mo").oninput=e=>{mt=parseFloat(e.target.value)||0;upd()};
$("#op").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,12);
$("#c1").onclick=async e=>{const b=e.target,n=Y.numero.replace(/\s/g,"");try{await navigator.clipboard.writeText(n)}catch{const t=document.createElement("textarea");t.value=n;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}b.textContent="¡Copiado!";setTimeout(()=>b.textContent="Copiar número",1600)};
$("#pf").onsubmit=e=>{e.preventDefault();if(busy)return;er();
 const c=C(),p=Pl(),t=$("#tit").value.trim().replace(/\s+/g," "),op=$("#op").value;
 if(!okm())return er(`El monto mínimo es S/ ${PR.min} y el máximo S/ ${PR.max}.`);
 if(BY.promoPendiente(s.email,c.id))return er("Ya tienes un pago de promoción en verificación para este curso.");
 if(t.length<3||!/^\p{L}[\p{L}' .-]*$/u.test(t))return er("Escribe tu nombre tal como aparece en Yape.");
 if(!/^\d{6,12}$/.test(op))return er("El N.º de operación son solo números (lo ves en el comprobante de Yape).");
 if(BY.opUsada(op))return er("Ese N.º de operación ya fue enviado. Revisa que sea el de tu pago.");
 busy=true;const b=$("#go");b.disabled=true;b.textContent="Enviando…";
 setTimeout(()=>{espera(BY.registrarPromo(s,c,p,{titular:t,op}),c)},700)};
upd();hist()}

function espera(r,c){
M.innerHTML=`<div class="box ok"><div class="ck2 w"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h1 style="animation:none">¡Recibimos tu pago!</h1><span class="pl">Promoción en verificación</span><p class="sub" style="margin-top:12px">Estamos confirmando tu Yape. Normalmente tarda hasta <b>2 horas</b>, a veces menos. Apenas se valide, «${c.titulo}» aparecerá en Promociones y te avisaremos en tus notificaciones. Puedes cerrar esta página.</p>
<div class="rc"><div><span>Solicitud</span><b>${E(r.id)}</b></div><div><span>Curso</span><b>${c.titulo}</b></div><div><span>Promoción</span><b>${E(r.plan.nombre)}</b></div><div><span>Monto</span><b>${money(r.monto)}</b></div><div><span>N.º de operación</span><b>${E(r.detalle.op)}</b></div><div><span>Enviado</span><b>${E(r.fecha)} ${E(r.hora)}</b></div></div>
<a class="btn" href="instructor.html">Volver a mis cursos</a><a class="btn o" href="promocionar.html">Promocionar otro curso</a></div>`;
const t=setInterval(()=>{const x=BY.pagos().find(p=>p.id===r.id);if(!x||x.estado==='verificando')return;clearInterval(t);
 if(x.estado==='pagado')M.innerHTML=`<div class="box ok"><div class="ck2"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1 style="animation:none">¡Tu promoción está activa!</h1><p class="sub">«${c.titulo}» se muestra en Promociones del ${fd(x.inicio||BY.hoy())} al ${fd(x.fin||BY.hoy())}.</p><a class="btn" href="inicio.html">Ver promociones</a></div>`;
 else location.replace('promocionar.html?id='+c.id)},3000)}
</script></body></html>
