<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso · Bayora Academy</title>
<script src="bayora.js"></script>
<style>.hero{color:#fff;padding:44px 0}.w{max-width:1120px;margin:auto;padding:0 24px}.hero h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15;animation:up .6s both}.hero p{opacity:.9;margin-top:8px}.tag{display:inline-block;background:rgba(6,21,27,.55);padding:4px 12px;border-radius:99px;font-size:.78rem;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 320px;gap:24px;padding:26px 24px 60px;max-width:1168px;margin:auto}.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;animation:up .6s both}.box h2{font-size:1.1rem;margin-bottom:12px}
.les{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}.les input{width:18px;height:18px;accent-color:#00a896}.les.d span{text-decoration:line-through;color:var(--soft)}.les em{margin-left:auto;font-style:normal;font-size:.75rem;color:var(--soft)}.les em+em{margin-left:0}
.vl{cursor:pointer}.vl:hover{color:var(--deep);text-decoration:underline}.hero{background-size:cover;background-position:center}.big{font-size:1.9rem;font-weight:800}.btn{display:block;width:100%;background:var(--green);color:#03231c;font-weight:700;padding:13px;border-radius:999px;margin-top:14px;text-align:center;transition:.15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.o{background:#fff;border:1px solid var(--deep);color:var(--deep)}
.pg{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.pg i{display:block;height:100%;background:var(--green);transition:width .5s}.meta{display:grid;gap:8px;margin-top:14px;font-size:.88rem;color:var(--soft)}
#cert{position:fixed;inset:0;background:rgba(3,12,16,.82);display:grid;place-items:center;padding:16px;z-index:30;overflow:auto}#cert[hidden]{display:none}
.cw{width:min(980px,100%)}.ct{container-type:inline-size;width:100%;aspect-ratio:297/210;background:radial-gradient(circle at 50% 45%,#fff 0,#fff 55%,#eef6f5 100%);position:relative;color:#10262b;font-family:"Palatino Linotype",Palatino,Georgia,serif;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ct .bn{position:absolute;left:0;right:0;height:1.6cqw;background:linear-gradient(90deg,#06151b,#0a6b5b,#19b5c4)}.ct .bn.a{top:0}.ct .bn.b{bottom:0}
.ct .f1{position:absolute;inset:2.4cqw;border:.5cqw solid #0a6b5b}.ct .f2{position:absolute;inset:3.5cqw;border:.15cqw solid #b8923a}
.ct .cn{position:absolute;inset:5.2cqw 7cqw 4.6cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.ct .lg{display:flex;align-items:center;gap:1.3cqw}.ct .lg svg{width:4.6cqw;height:4.6cqw}.ct .lg div{text-align:left}.ct .lg b{display:block;font:800 2cqw/1 system-ui,sans-serif;letter-spacing:.32em;color:#06151b}.ct .lg small{display:block;font:700 .9cqw/1 system-ui,sans-serif;letter-spacing:.78em;color:#0a6b5b;margin-top:.5cqw}
.ct .t1{font-size:4.4cqw;font-weight:700;color:#06151b;margin-top:2.2cqw;line-height:1.1}.ct .t1+i{display:block;width:16cqw;height:.2cqw;background:#b8923a;margin:1.2cqw auto 0}
.ct .o{font-size:1.5cqw;font-style:italic;color:#52686d;margin-top:1.8cqw}
.ct .nm{font-weight:700;color:#0a6b5b;margin-top:1cqw;padding:0 3cqw .6cqw;border-bottom:.15cqw solid #b8923a;letter-spacing:.04em;text-transform:uppercase;max-width:100%}
.ct .dn{font:600 1.5cqw system-ui,sans-serif;margin-top:1cqw;letter-spacing:.1em}.ct .cu{font-weight:700;color:#06151b;margin-top:.8cqw;line-height:1.2}.ct .mt{font:1.2cqw system-ui,sans-serif;color:#52686d;margin-top:1cqw}
.ct .ft{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end}.ct .sg{width:24cqw;text-align:center}.ct .sg .s1{font:2.4cqw/3.4cqw "Brush Script MT","Segoe Script",cursive;color:#06151b;height:3.4cqw}.ct .sg .ln{border-top:.12cqw solid #06151b;padding-top:.6cqw;font:700 1.1cqw system-ui,sans-serif;letter-spacing:.06em}.ct .sg small{display:block;font:1cqw system-ui,sans-serif;color:#52686d}.ct .sl svg{width:11cqw;height:11cqw}
.ct .vc{margin-top:1.4cqw;font:1cqw system-ui,sans-serif;color:#52686d}.ct .vc b{color:#06151b;letter-spacing:.1em}
.cb2{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}.cb2 button{padding:11px 24px;border-radius:99px;font-weight:700;background:var(--green);color:#03231c}.cb2 .x{background:#e6eeef;color:var(--ink)}.hint{color:#c9d6d9;font-size:.8rem;text-align:center;margin-top:8px}
#dat{position:fixed;inset:0;background:rgba(3,12,16,.7);display:grid;place-items:center;padding:16px;z-index:40}#dat[hidden]{display:none}.dm{background:#fff;border-radius:16px;padding:26px;width:min(440px,100%);animation:up .3s both}.dm h2{font-size:1.25rem}.dm p{color:var(--soft);font-size:.88rem;margin-top:6px}.dm label{display:block;font-weight:700;font-size:.85rem;margin-top:14px}.dm input{width:100%;height:46px;margin-top:6px;padding:0 14px;border:1px solid #8c9da1;border-radius:8px;font-weight:400;font-size:1rem}.dm input:focus{outline:2px solid var(--green);border-color:var(--deep)}.dm .er{color:#8f2a1f;min-height:1.3em;margin-top:10px}.dm .ac{display:flex;gap:10px;margin-top:6px}.dm .ac button{flex:1;padding:12px;border-radius:999px;font-weight:700;background:var(--green);color:#03231c}.dm .ac .x{background:#e6eeef;color:var(--ink)}
.dc{margin-top:14px;padding:12px;background:var(--mist);border-radius:10px;font-size:.85rem;display:grid;gap:2px}.dc small{color:var(--soft)}.lk2{background:none;color:var(--deep);font-weight:700;font-size:.8rem;text-align:left;margin-top:4px;padding:0;text-decoration:underline}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
@media print{@page{size:A4 landscape;margin:0}html,body{background:#fff!important}.bz-sb,.bz-tb,.bz-set,#app,#dat,.cb2,.hint{display:none!important}.bz-shell{display:block!important}#cert{background:#fff;padding:0;display:block;overflow:visible}.cw{width:297mm}.ct{width:297mm;height:210mm;box-shadow:none}}</style></head><body>
<div id="app"></div><div id="dat" hidden></div><div id="cert" hidden></div>
<script>
const {s,u}=BY.hdr("c"),G=BY.get,id=new URLSearchParams(location.search).get("id"),c=G('courses').find(x=>x.id===id),$=x=>document.querySelector(x);
if(!c){document.getElementById("app").innerHTML='<div class="w" style="padding:60px 24px"><h1>Curso no encontrado</h1><p><a href="catalogo.html" style="color:var(--deep);font-weight:700">Volver al catálogo</a></p></div>'}else{
let cur=null;const L=BY.lessons(c),mine=()=>(G('enroll',{})[s.email]||{})[c.id];
/* SS[i]: nivel y evaluación de cada sesión (cursos creados con el constructor) */
const SS=(c.niveles||[]).flatMap((n,ni)=>n.sesiones.map(x=>({ev:x.eval,ni})));
const save=d=>{const e=G('enroll',{});e[s.email]={...(e[s.email]||{}),[c.id]:d};BY.set('enroll',e)};
let wp=!!BY.pendiente(s.email,c.id);setInterval(()=>{const n=!!BY.pendiente(s.email,c.id);if(n!==wp){wp=n;draw()}},4000);
function draw(){const d=mine(),on=Array.isArray(d),F=BY.ficha(s.email,c.id),p=on?Math.round(100*d.length/L.length):0,adm=u.rol==="admin",ul=i=>adm||(on&&(i===0||d.includes(i-1)));
$("#app").innerHTML=`<section class="hero" data-m="${c.portada||''}" style="background:linear-gradient(120deg,${c.colores[0]},${c.colores[1]})"><div class="w"><span class="tag">${c.categoria}</span><h1>${c.titulo}</h1><p>Por ${c.instructor}${c.rating?' · ★ '+c.rating.toFixed(1):''}</p></div></section>
<div class="cols"><div><div class="box"><h2>Acerca del curso</h2><p>${c.descripcion||'Un curso práctico de Bayora Academy para que avances a tu ritmo y certifiques tu conocimiento.'}</p></div>
<div id="vw"></div><div class="box" style="margin-top:20px"><h2>Contenido · ${L.length} lecciones</h2>${L.map((l,i)=>`${SS[i]&&(i===0||SS[i-1].ni!==SS[i].ni)?`<h3 style="margin-top:14px;font-size:.95rem">Nivel ${String(SS[i].ni+1).padStart(2,'0')}</h3>`:''}<div class="les ${on&&d.includes(i)?'d':''}"><input type="checkbox" data-i="${i}" ${on&&ul(i)&&!(SS[i]&&SS[i].ev)?'':'disabled'} ${on&&d.includes(i)?'checked':''}><span class="vl" data-v="${i}">${on&&d.includes(i)?'✓':ul(i)?'▶':'🔒'} ${i+1}. ${l.t}${l.tipo&&l.tipo!=='texto'?' · '+l.tipo:''}</span>${SS[i]&&SS[i].ev?'<em>Evaluación</em>':''}${ul(i)?'':'<em>Bloqueada</em>'}</div>`).join("")}</div></div>
<aside class="box"><div class="big">${c.precio?'S/ '+c.precio:'Gratis'}</div>${on?`<div class="pg"><i style="width:${p}%"></i></div><b>${p}% completado</b><small style="display:block;color:var(--soft)">${d.length} de ${L.length} sesiones completadas</small><div class="dc">${F?`<small>Certificado a nombre de</small><b>${BY.esc(F.nombre)}</b><small>DNI ${BY.esc(F.dni)}</small>`:'<small>Aún no registras los datos de tu certificado.</small>'}${p<100||!F?`<button class="lk2" id="ed">${F?'Corregir mis datos':'Completar mis datos'}</button>`:''}</div>${p===100?'<button class="btn" id="gc">Ver mi certificado</button>':''}`:(c.precio&&BY.pendiente(s.email,c.id)?`<div class="dc"><b>Pago en verificación</b><small>Estamos confirmando tu Yape (suele tardar hasta 2 horas). Te daremos acceso apenas se valide.</small></div><a class="btn" href="pago.html?id=${c.id}">Ver estado del pago</a>`:`<button class="btn" id="en">${c.precio?'Comprar curso':'Inscribirme gratis'}</button>`)}
<a class="btn o" href="catalogo.html">Volver al catálogo</a><div class="meta"><span>${L.length} lecciones</span><span>${c.estudiantes||0} estudiantes</span><span>Certificado al terminar</span></div></aside></div>`;
if($("#ed"))$("#ed").onclick=()=>pedir(draw);
if($("#en"))$("#en").onclick=()=>pedir(()=>{if(c.precio)return location.href='pago.html?id='+c.id;save([]);BY.set('courses',G('courses').map(x=>x.id===c.id?{...x,estudiantes:(x.estudiantes||0)+1}:x));draw()});
document.querySelectorAll(".les input").forEach(i=>i.onchange=()=>{const n=+i.dataset.i,d=new Set(mine());i.checked?d.add(n):d.delete(n);save([...d]);draw()});
if($("#gc"))$("#gc").onclick=cert;if(on&&p===100&&F)BY.issue(s,c,F);
document.querySelectorAll(".vl").forEach(x=>x.onclick=()=>{if(!ul(+x.dataset.v))return;cur=+x.dataset.v;draw();$("#vw").scrollIntoView({behavior:"smooth"})});
if(cur!==null&&ul(cur))show(cur);BY.hydrate($("#app"))}
async function show(i){const l=L[i];let m="";if(l.media){const src=await BY.url(l.media);if(src)m=l.tipo==="video"?`<video controls src="${src}" style="width:100%;border-radius:10px;margin-top:12px"></video>`:`<img src="${src}" style="max-width:100%;border-radius:10px;margin-top:12px">`}
const ev=SS[i]&&SS[i].ev,dn=(mine()||[]).includes(i);
$("#vw").innerHTML=`<div class="box" style="margin-top:20px"><h2>${l.t}</h2><p style="white-space:pre-wrap">${l.texto||""}</p>${m}</div>${ev&&Array.isArray(mine())?(dn?'<div class="box" style="margin-top:20px"><b>✓ SESIÓN APROBADA</b></div>':exam(ev)):''}`;
const sx=$("#sx");if(sx)sx.onclick=()=>grade(ev,i)}
const exam=ev=>`<div class="box" style="margin-top:20px" id="ex"><h2>Evaluación de la sesión</h2><p style="color:var(--soft)">Necesitas al menos ${ev.min}/20 para continuar.</p>${ev.preguntas.map((p,k)=>`<fieldset style="border:0;margin:14px 0"><legend><b>${k+1}. ${BY.esc(p.q)}</b> <small>(${p.pts} pts)</small></legend>${p.ops.map((o,j)=>`<label style="display:block;padding:4px 0"><input type="radio" name="q${k}" value="${j}"> ${BY.esc(o.t)}</label>`).join("")}</fieldset>`).join("")}<button class="btn" id="sx">ENVIAR RESPUESTAS</button></div>`;
function grade(ev,i){if(document.querySelectorAll("#ex input:checked").length<ev.preguntas.length)return alert("Responde todas las preguntas.");
const t=ev.preguntas.reduce((a,p)=>a+(+p.pts||0),0)||1;let g=0;ev.preguntas.forEach((p,k)=>{const r=document.querySelector(`input[name=q${k}]:checked`);if(r&&p.ops[+r.value].ok)g+=+p.pts||0});
const n=Math.round(g/t*200)/10,ok=n>=ev.min;
$("#ex").innerHTML=ok?`<h2>✓ SESIÓN APROBADA</h2><p>Has obtenido ${n}/20. Puedes continuar con la siguiente sesión.</p><button class="btn" id="nx">CONTINUAR →</button>`:`<h2>✕ SESIÓN NO APROBADA</h2><p>Has obtenido ${n}/20. Necesitas obtener al menos ${ev.min}/20 para continuar.</p><button class="btn" id="nx">VOLVER A INTENTAR</button>`;
$("#nx").onclick=()=>{if(ok){const d=new Set(mine());d.add(i);save([...d]);cur=i+1<L.length?i+1:i;draw()}else show(i)}}
function pedir(ok){const f=BY.ficha(s.email,c.id)||BY.lastFicha(s.email)||{},m=$("#dat");m.hidden=false;
m.innerHTML=`<form class="dm" id="df" novalidate><h2>Datos para tu certificado</h2><p>Escríbelos tal como quieres que aparezcan. Se imprimirán en tu certificado de «${BY.esc(c.titulo)}».</p><label>Nombre completo<input name="n" value="${BY.esc(f.nombre||'')}" autocomplete="name" placeholder="Ej.: María Fernanda Quispe Rojas" required></label><label>DNI<input name="d" value="${BY.esc(f.dni||'')}" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8 dígitos" required></label><p class="er" id="de" role="alert"></p><div class="ac"><button type="button" class="x" id="dx">Cancelar</button><button type="submit">Continuar</button></div></form>`;
m.querySelector("input").focus();$("#dx").onclick=()=>{m.hidden=true};
$("#df").onsubmit=e=>{e.preventDefault();const n=e.target.n.value.trim().replace(/\s+/g," "),d=e.target.d.value.trim(),er=$("#de");
if(n.length<5||n.split(" ").length<2||!/^\p{L}[\p{L}' .-]*$/u.test(n))return er.textContent="Escribe tu nombre completo (nombres y apellidos), solo con letras.";
if(!/^\d{8}$/.test(d))return er.textContent="El DNI debe tener exactamente 8 números.";
BY.setFicha(s.email,c.id,{nombre:n,dni:d});m.hidden=true;ok()}}
function cert(){const F=BY.ficha(s.email,c.id);if(!F)return pedir(cert);const r=BY.issue(s,c,F);if(r.estado!=="vigente"){alert("Este certificado fue revocado por la administración.");return}
const n=r.nombre,fz=n.length<=24?4:n.length<=32?3.3:n.length<=42?2.7:2.2,tz=c.titulo.length<=40?2.8:c.titulo.length<=70?2.3:1.9,E=BY.esc,
fe=new Date(r.fecha+"T12:00:00").toLocaleDateString("es-PE",{day:"numeric",month:"long",year:"numeric"});
$("#cert").hidden=false;$("#cert").innerHTML=`<div class="cw"><div class="ct"><i class="bn a"></i><i class="bn b"></i><div class="f1"></div><div class="f2"></div><div class="cn">
<div class="lg"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19b5c4"/><stop offset="1" stop-color="#0fd3a0"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#cg)"/><path d="M12 10h9.5a5.2 5.2 0 013.3 9.2A5.6 5.6 0 0122 30H12z" fill="#06151b"/><path d="M17 14.6v3.8h4.2a1.9 1.9 0 000-3.8zm0 8v3.8h4.8a1.9 1.9 0 000-3.8z" fill="url(#cg)"/></svg><div><b>BAYORA</b><small>ACADEMY</small></div></div>
<div class="t1">Certificado de Finalización</div><i></i>
<div class="o">Bayora Academy otorga el presente certificado a</div>
<div class="nm" style="font-size:${fz}cqw">${E(n)}</div>
<div class="dn">DNI N.º ${E(r.dni||F.dni)}</div>
<div class="o">por haber completado satisfactoriamente el curso</div>
<div class="cu" style="font-size:${tz}cqw">${E(c.titulo)}</div>
<div class="mt">${E(c.categoria)} · ${L.length} lecciones · Emitido el ${fe}</div>
<div class="ft"><div class="sg"><div class="s1">${E(c.instructor)}</div><div class="ln">INSTRUCTOR DEL CURSO</div></div>
<div class="sl"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="gs" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#e8cd85"/><stop offset="1" stop-color="#a67c24"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="none" stroke="#b8923a" stroke-width="7" stroke-dasharray="5 3"/><circle cx="50" cy="50" r="41" fill="url(#gs)"/><circle cx="50" cy="50" r="34" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/><path d="M33 51l11 11 23-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="sg"><div class="s1">Bayora Academy</div><div class="ln">DIRECCIÓN ACADÉMICA</div></div></div>
<div class="vc">Código de verificación: <b>${E(r.code)}</b> · Valídalo con la administración de Bayora Academy</div></div></div>
<div class="cb2"><button onclick="print()">Descargar PDF</button><button class="x" onclick="$('#cert').hidden=true">Cerrar</button></div><p class="hint">En la ventana que se abre elige «Guardar como PDF» como destino.</p></div>`}
draw();if(new URLSearchParams(location.search).get("cert")&&mine()?.length>=L.length)cert()}
</script></body></html>
